                > /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list
              apt-get -o Acquire::Retries=5 update
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends gcc-11 g++-11
              curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 30 \
                https://apt.kitware.com/keys/kitware-archive-latest.asc \
                | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ bionic main" \
                > /etc/apt/sources.list.d/kitware.list
              apt-get -o Acquire::Retries=5 update
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends cmake
              cmake --version
              bash ./tools/build_linux_runtime_libva.sh
              bash ./tools/build_linux_runtime_pipewire.sh
              bash ./tools/prepare_third_party.sh "" linux linux-ubuntu18-armhf-m144-gnu ffmpeg-n8.1-latest-linuxarmhf-lgpl-shared-8.1.tar.xz
              bash ./tools/build_package.sh \
                --configure-preset linux-armhf \
                --build-preset linux-armhf \
                --portable-package-name airan-desk-linux-armhf-glibc2.27-portable \
                --portable-glibc-floor 2.27 \
                --cmake-arg -DCMAKE_C_COMPILER=gcc-11 \
                --cmake-arg -DCMAKE_CXX_COMPILER=g++-11 \
                --cmake-arg -DCMAKE_FIND_ROOT_PATH= \
                --cmake-arg "-DCMAKE_PREFIX_PATH=$PWD/third_party/linux-runtime/pipewire-sdk" \
                --cmake-arg -DAIRAN_REQUIRE_PIPEWIRE_CAPTURE=ON
          AIRAN_DOCKER_SCRIPT
      - name: Fix package ownership
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v7
        with:
          name: airan-desk-linux-armhf-glibc2.27-portable
          path: out/packages/airan-desk-linux-armhf-glibc2.27-portable.tar.gz

  macos-x64:
    name: macOS x64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake qt@5 zstd
      - name: Prepare third-party packages
        run: bash ./tools/prepare_third_party.sh "" macos apple-macos-x64-m144
      - name: Build and package
        run: bash ./tools/build_package.sh --configure-preset macos-x64 --build-preset macos-x64 --package-name airan-desk-macos-x64
      - uses: actions/upload-artifact@v7
        with:
          name: airan-desk-macos-x64
          path: out/packages/airan-desk-macos-x64.tar.gz

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake qt@5 zstd
      - name: Prepare third-party packages
        run: bash ./tools/prepare_third_party.sh "" macos apple-macos-arm64-m144
      - name: Build and package
        run: bash ./tools/build_package.sh --configure-preset macos-arm64 --build-preset macos-arm64 --package-name airan-desk-macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: airan-desk-macos-arm64
          path: out/packages/airan-desk-macos-arm64.tar.gz

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    needs:
      - win10-x64
      - win10-arm64
      - win7-x86
      - linux-x64-glibc2_27-portable
      - linux-x64-glibc2_17-portable
      - linux-arm64-glibc2_27-portable
      - linux-armhf-glibc2_27-portable
      - macos-x64
      - macos-arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          VERSION=$(grep -m1 'project(airan-desk VERSION' CMakeLists.txt \
            | sed 's/.*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          git log -1 --format=%B "$GITHUB_SHA" > release-notes.txt

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mapfile -t RELEASE_FILES < <(python3 - <<'PY'
          from pathlib import Path
          files = sorted(
              (path for path in Path("artifacts").rglob("*") if path.is_file()),
              key=lambda path: (path.name, str(path)),
          )
          for path in files:
              print(path)
          PY
          )

          gh release create "$TAG" "${RELEASE_FILES[@]}" \
            --title "airan-desk $TAG" \
            --notes-file release-notes.txt \
            --latest
